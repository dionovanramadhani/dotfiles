general.import = [
  "~/.config/alacritty/themes/themes/thelovelace.toml"
]

[env]
TERM = "xterm-256color"

[window]
padding.x = 10
padding.y = 25
dimensions.columns = 145
dimensions.lines = 45
position.x = 50
position.y = 50

decorations = "None"
opacity = 0.85
# blur = true

option_as_alt = "Both"

[font]
size = 12

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Bold"

# [font.offset]
# x = 0
# y = 7

[colors.primary]
# Gruvbox Dark
background = '#282828'
foreground = '#ebdbb2'

[colors.normal]
# Gruvbox Dark Colors
black   = '#282828'
red     = '#cc241d'
green   = '#98971a'
yellow  = '#d79921'
blue    = '#458588'
magenta = '#b16286'
cyan    = '#689d6a'
white   = '#a89984'

[colors.bright]
# Gruvbox Dark Bright Colors
black   = '#928374'
red     = '#fb4934'
green   = '#b8bb26'
yellow  = '#fabd2f'
blue    = '#83a598'
magenta = '#d3869b'
cyan    = '#8ec07c'
white   = '#ebdbb2'

[terminal.shell]
program = "/bin/zsh"

[[keyboard.bindings]]
key = "Up"
mods = "Alt"
chars = "\u001b[1;3A"

[[keyboard.bindings]]
key = "Down"
mods = "Alt"
chars = "\u001b[1;3B"

[[keyboard.bindings]]
key = "Up"
mods = "Alt|Shift"
chars = "\u001b[1;4A"

[[keyboard.bindings]]
key = "Down"
mods = "Alt|Shift"
chars = "\u001b[1;4B"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
