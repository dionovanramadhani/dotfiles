;   To learn more about how to configure Polybar
;   go to https://github.com/polybar/polybar

include-file = ./include-modules.ini

[bar/main]
width = 98%
height = 36
offset-x = 1%
offset-y = 6
bottom = true
fixed-center = true
radius = 8

wm-restack = bspwm

locale = en_US.UTF-8
override-redirect = false

scroll-up = next
scroll-down = prev

enable-ipc = true

background = ${colors.bg}
foreground = ${colors.fg}

font-0 = "JetBrainsMono:style=Bold:size=10;3"
font-1 = "Material Icons Round:size=14;5"
font-2 = "AtkynsonMono Nerd Font Mono:style=Bold:size=10;3"
font-3 = "AtkynsonMono Nerd Font Mono:style=Bold:size=13;3"
font-4 = "AtkynsonMono Nerd Font Mono:style=Bold:size=14;3"
font-5 = "AtkynsonMono Nerd Font Mono:style=Bold:size=18;4"
font-6 = "AtkynsonMono Nerd Font Mono:style=Bold:size=8;3"


include-file = ./modules.ini

cursor-click = pointer
cursor-scroll = ns-resize

[bar/secondary]
inherit = bar/main
monitor = HDMI-0
modules-left = taskbar-hdmi
modules-center =
modules-right =

[settings]
screenchange-reload = true
pseudo-transparency = true
