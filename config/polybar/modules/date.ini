[module/date]
type = custom/script
exec = date "+%a, %b %d %Y | %H:%M"
interval = 1

format = <label>
format-prefix = %{T1}%{T-}
format-prefix-foreground = ${colors.purple}
format-foreground = ${colors.fg}
format-padding = 1
label = %{T0}%output%%{T-}
label-padding = 1

click-left = bash ~/.config/polybar/scripts/calendar.sh &
