[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = true

format-volume = %{A1:/home/dionovan/.local/bin/audio_device_menu.sh:}<label-volume>%{A}
format-volume-padding = 1
format-volume-prefix = %{A1:/home/dionovan/.local/bin/audio_device_menu.sh:}%{T0}%{T-}%{A}
format-volume-prefix-foreground = ${colors.orange}
label-volume = %{T0}%percentage%%%{T-}
label-volume-foreground = ${colors.fg}
label-volume-padding = 1

format-muted = %{A1:/home/dionovan/.local/bin/audio_device_menu.sh:}<label-muted>%{A}
format-muted-padding = 1
format-muted-prefix = %{A1:/home/dionovan/.local/bin/audio_device_menu.sh:}%{T0}%{T-}%{A}
format-muted-prefix-foreground = ${colors.red}
label-muted = %{T0}%percentage%%%{T-}
label-muted-foreground = ${colors.fg}
label-muted-padding = 1
