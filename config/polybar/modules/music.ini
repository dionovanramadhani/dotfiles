[module/music-status]
type = custom/script
exec = python3 ~/.config/polybar/scripts/music_status.py
interval = 2
format = <label>
format-foreground = ${colors.cyan}
format-padding = 1

[module/cava]
type = custom/script
tail = true
exec = bash ~/.config/polybar/scripts/cava.sh
format = <label>
format-foreground = ${colors.green}
format-padding = 1
