# Menggunakan backend GLX (OpenGL) milik NVIDIA, bukan XRender bawaan CPU
backend = "glx";

# Sinkronisasi vertikal untuk mencegah screen tearing dan jendela membeku
vsync = true;

# Pengaturan rendering GLX agar stabil di driver proprietary NVIDIA
# glx-no-stencil = true;
# glx-no-rebind-pixmap = true;
use-damage = true;

# Efek animasi pudar (Fading) saat jendela dibuka/ditutup agar transisinya mulus
fading = true;
fade-delta = 4;
fade-in-step = 0.03;
fade-out-step = 0.03;

# Transparency settings for inactive windows
inactive-opacity = 0.85;
inactive-opacity-override = false;
focus-exclude = [
    "class_g = 'Polybar'",
    "class_g = 'Rofi'"
];

# Efek Blur (Dual Kawase) untuk performa dan visual terbaik di GPU NVIDIA
blur: {
  method = "dual_kawase";
  strength = 5;
  background = true;
  background-frame = false;
  background-fixed = false;
}

# Mengecualikan beberapa tipe jendela agar tidak di-blur (seperti dock bar)
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'slop'",
  "_GTK_FRAME_EXTENTS@"
];

# Aturan transparansi khusus untuk VS Code (Code)
# 90% opacity saat aktif (focused), 80% opacity saat tidak aktif
opacity-rule = [
    "95:class_g = 'Code' && focused",
    "80:class_g = 'Code' && !focused",
    "95:class_g = 'code' && focused",
    "80:class_g = 'code' && !focused",
    "95:class_g = 'antigravity-ide' && focused",
    "80:class_g = 'antigravity-ide' && !focused",
    "95:class_g = 'Antigravity IDE' && focused",
    "80:class_g = 'Antigravity IDE' && !focused",
    "95:class_g = 'Antigravity-ide' && focused",
    "80:class_g = 'Antigravity-ide' && !focused",
    "95:class_g = 'antigravity ide' && focused",
    "80:class_g = 'antigravity ide' && !focused"
];
